<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nur - Quran Journey</title>

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2D5A4C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* Premium Emerald Palette */
            --bg-primary: #F4F7F6;
            --bg-secondary: #E0EBE8;
            --text-primary: #112320;
            --text-secondary: #5C7F75;
            --accent: #1E6F5C;
            --accent-light: #289B80;
            --accent-dark: #124338;
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.7);
        }

        .dark {
            /* Deep Forest Night Palette */
            --bg-primary: #050A09;
            --bg-secondary: #0D1F1A;
            --text-primary: #E8F3F0;
            --text-secondary: #8DA9A0;
            --accent: #4FD1B3;
            /* More vibrant in dark mode */
            --accent-light: #70E2C8;
            --accent-dark: #2D5A4C;
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(13, 31, 26, 0.7);
        }

        body {
            font-family: 'Outfit', 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            direction: rtl;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
            border-radius: 10px;
        }
    </style>

</head>
